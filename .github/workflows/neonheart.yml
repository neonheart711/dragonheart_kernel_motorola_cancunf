name: Build NeonHeart NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Install Build Dependencies for kramel.sh
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex libssl-dev libelf-dev make libc6-dev libncurses-dev \
            zip unzip curl wget dialog python3 cpio lz4 kmod xz-utils tar dwarves \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: 3. Inject NetHunter & Wi-Fi Drivers into dragonheart_defconfig
        run: |
          # Remove uploaded original_kernel.zip if present to keep working tree clean
          rm -f original_kernel.zip

          # Integrate external RTL8812AU / RTL8821AU (5GHz) driver as a loadable module
          git clone --depth=1 -b v5.6.4.2 https://github.com/aircrack-ng/rtl8812au.git drivers/net/wireless/realtek/rtl8812au || true
          if [ -d "drivers/net/wireless/realtek/rtl8812au" ]; then
            echo 'obj-$(CONFIG_88XXAU) += rtl8812au/' >> drivers/net/wireless/realtek/Makefile
            sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/g' drivers/net/wireless/realtek/rtl8812au/Makefile
            sed -i 's/CONFIG_PLATFORM_ANDROID_ARM64 = n/CONFIG_PLATFORM_ANDROID_ARM64 = y/g' drivers/net/wireless/realtek/rtl8812au/Makefile
            echo "EXTRA_CFLAGS += -Wno-error -Wno-incompatible-pointer-types -Wno-enum-conversion" >> drivers/net/wireless/realtek/rtl8812au/Makefile
            if ! grep -q "rtl8812au/Kconfig" drivers/net/wireless/realtek/Kconfig; then
              sed -i '/endif/i source "drivers/net/wireless/realtek/rtl8812au/Kconfig"' drivers/net/wireless/realtek/Kconfig
            fi
          fi

          # Append NeonHeart name, NetHunter, HID, and Wi-Fi Adapter configs to dragonheart_defconfig
          cat << 'EOF' >> arch/arm64/configs/dragonheart_defconfig
          CONFIG_LOCALVERSION="-NeonHeart"
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_ECM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211_MESH=y
          CONFIG_WLAN_VENDOR_MEDIATEK=y
          CONFIG_MT7601U=y
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_88XXAU=m
          CONFIG_RTL8187=y
          CONFIG_RTLWIFI=y
          CONFIG_RTL8192CU=y
          CONFIG_RTL8XXXU=y
          CONFIG_RTL8XXXU_UNTESTED=y
          CONFIG_WLAN_VENDOR_RALINK=y
          CONFIG_RT2X00=y
          CONFIG_RT2800USB=y
          CONFIG_RT2800USB_RT33XX=y
          CONFIG_RT2800USB_RT35XX=y
          CONFIG_RT2800USB_RT3573=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_RT2800USB_RT55XX=y
          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_ATH_CARDS=y
          CONFIG_ATH9K_HTC=y
          CONFIG_CARL9170=y
          CONFIG_USB_RTL8152=y
          CONFIG_BT_HCIBTUSB=y
          CONFIG_BT_RFCOMM=y
          CONFIG_BT_RFCOMM_TTY=y
          EOF

      - name: 4. Configure Official kramel.sh for NeonHeart
        run: |
          # Replace upr "${VERSION}" with a no-op (:) so line 906 stays valid bash syntax
          sed -i 's/upr "\${VERSION}"/:/g' kramel.sh

          # Verify YAAP modules.load branch availability
          if curl -sL --fail "https://github.com/yaap/device_motorola_cancunf/raw/staging/modules/modules.load.vendor_dlkm" >/dev/null; then
            sed -i 's/export MOD_BRANCH=.*/export MOD_BRANCH="staging"/g' kramel.sh
          elif curl -sL --fail "https://github.com/yaap/device_motorola_cancunf/raw/sixteen/modules/modules.load.vendor_dlkm" >/dev/null; then
            sed -i 's/export MOD_BRANCH=.*/export MOD_BRANCH="sixteen"/g' kramel.sh
          fi

          # Set NeonHeart builder branding in kramel.sh
          sed -i 's/export BUILDER=.*/export BUILDER="neonheart711"/g' kramel.sh
          sed -i 's/export KBUILD_BUILD_USER=.*/export KBUILD_BUILD_USER="neonheart711"/g' kramel.sh
          sed -i 's/export KBUILD_BUILD_HOST=.*/export KBUILD_BUILD_HOST="NeonHeart"/g' kramel.sh
          sed -i 's/zipn=DragonHeart-/zipn=NeonHeart-NetHunter-/g' kramel.sh

          # Include 88XXau.ko in vendor_dlkm if built
          sed -i '/depmod -b "\${DLKM_DIR}" 0.0/i if [ -f "\${DIST_DIR}/88XXau.ko" ]; then cp -p "\${DIST_DIR}/88XXau.ko" "\${DLKM_MODULES_DIR_FULL}"/; fi' kramel.sh

      - name: 5. Build Kernel, DTB, Modules & Zip via kramel.sh
        run: |
          export PATH="/usr/sbin:/sbin:$PATH"
          export CI=0
          export OTA=0
          export TGI=0
          export ARCH=arm64
          export SUBARCH=arm64

          chmod +x kramel.sh
          bash kramel.sh img mod || {
            echo "External rtl8812au driver had a compiler conflict, rebuilding with in-tree drivers..."
            sed -i '/rtl8812au/d' drivers/net/wireless/realtek/Makefile
            sed -i '/rtl8812au/d' drivers/net/wireless/realtek/Kconfig
            sed -i '/CONFIG_88XXAU/d' arch/arm64/configs/dragonheart_defconfig
            rm -rf drivers/net/wireless/realtek/rtl8812au
            bash kramel.sh clean
            bash kramel.sh img mod
          }

          # Set NeonHeart banner in AnyKernel3
          if [ -f "anykernel3-dragonheart/anykernel.sh" ]; then
            sed -i 's/kernel.string=.*/kernel.string=NeonHeart NetHunter Kernel by neonheart711/g' anykernel3-dragonheart/anykernel.sh
          fi

          bash kramel.sh mkzip

      - name: 6. Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: NeonHeart-NetHunter-Kernel
          path: anykernel3-dragonheart/*.zip
          
